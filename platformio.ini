[platformio]
default_envs = d1r32_bringup
src_dir = sketches/TurnoutBringup
lib_dir = lib

[env]
framework = arduino
monitor_speed = 115200

[env:d1r32_bringup]
platform = espressif32
board = esp32dev
lib_deps =
  madhephaestus/ESP32Servo @ ^3.0.0
  adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
build_flags =
  -DPCA9685_SDASCL
  -DRR_USE_KS0258=1
  ; DEBUG / RR_DEBUG off: 45-135 power-up cycle. Uncomment to hold 90.
  ; HACK / LCC_ON / OPTIMIZE_MEMORY left off

[env:mega2560_bringup]
platform = atmelavr
board = megaatmega2560
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2

[env:uno_bringup]
platform = atmelavr
board = uno
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
